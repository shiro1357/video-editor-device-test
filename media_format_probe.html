<style>

<body>
<h1>Media Format Probe <small>Step A / v1.1.0</small></h1>
<div class="chips" id="envChips"></div><div id="secWarn" class="warn" hidden>⚠ 安全なコンテキスト（HTTPS等）ではありません。WebCodecs等が使えない場合があります。GitHub Pages等のHTTPSで開いてください。</div>
<small>動画・画像・音声の「解析できた」「ブラウザがデコードできた」「実際に表示/再生できた」を別々に検査します。ファイルは端末内でのみ処理し、送信しません。1ファイルずつ順番に検査します。</small>

<div class="card" style="margin-top:10px">
  <div class="drop" id="drop">

    </div>
    <small>動画・画像・音声（複数可）。ここへドロップも可。</small>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="bJson">JSON保存</button><button class="sec" id="bCopy">JSONコピー</button><button class="sec" id="bShow">JSON表示</button>

  </div>
  <pre id="jsonView" hidden></pre>
</div>

<div class="card"><details><summary>実行環境・ライブラリ</summary><div id="envBox"></div></details></div>
<div id="list"></div>

<script>
'use strict';
/* ============ 定数 ============ */
const TOOL={name:'media_format_probe',version:'1.1.0',schema:'media-format-probe/1'};
const MB_VER='1.64.0';
// 相対パス（GitHub Pagesのリポジトリ配下でも動く）を先に試し、無ければ固定バージョンのCDNへ
const MB_SOURCES=['./vendor/mediabunny.min.mjs','https://cdn.jsdelivr.net/npm/mediabunny@'+MB_VER+'/dist/bundles/mediabunny.min.mjs'];
const TO={meta:15000,loaded:8000,canplay:4000,frame:2500,seek:6000,imgDecode:20000,mbLoad:20000};
const LISTEN_MS=5000, THUMB_MAX=320, PKT_SAMPLE=300;
const UNK='不明／取得不可';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>performance.now();
const ms=n=>Math.round(n);
const fmtBytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(2)+' MB':(n/1073741824).toFixed(2)+' GB';
const fmtDur=s=>{if(!isFinite(s))return null;const m=Math.floor(s/60);return m+':'+(s-m*60).toFixed(3).padStart(6,'0')+' ('+s.toFixed(3)+'s)'};
const errStr=e=>e&&e.name?(e.name+': '+(e.message||'')):String(e);

/* ============ Object URL管理（解放漏れの可視化） ============ */
const liveUrls=new Set();
function mkUrl(blob){const u=URL.createObjectURL(blob);liveUrls.add(u);updLive();return u}
function rmUrl(u){if(u&&liveUrls.has(u)){URL.revokeObjectURL(u);liveUrls.delete(u);updLive()}}
function updLive(){const e=$('#liveInfo');if(e)e.textContent='使用中Object URL: '+liveUrls.size}

/* ============ 環境 ============ */
function detectEnv(){
  const ua=navigator.userAgent||'';let b='不明',v='';
  const m=(re)=>{const r=ua.match(re);return r?r[1]:''};
  if(/Edg\//.test(ua)){b='Edge';v=m(/Edg\/([\d.]+)/)}
  else if(/OPR\//.test(ua)){b='Opera';v=m(/OPR\/([\d.]+)/)}
  else if(/CriOS\//.test(ua)){b='Chrome(iOS)';v=m(/CriOS\/([\d.]+)/)}
  else if(/FxiOS\//.test(ua)){b='Firefox(iOS)';v=m(/FxiOS\/([\d.]+)/)}
  else if(/Firefox\//.test(ua)){b='Firefox';v=m(/Firefox\/([\d.]+)/)}
  else if(/Chrome\//.test(ua)){b='Chrome/Chromium';v=m(/Chrome\/([\d.]+)/)}
  else if(/Safari\//.test(ua)&&/Version\//.test(ua)){b='Safari';v=m(/Version\/([\d.]+)/)}

  if(/Windows/.test(ua))os='Windows';else if(/iPhone|iPad/.test(ua))os='iOS/iPadOS';
  else if(/Macintosh/.test(ua))os=(navigator.maxTouchPoints>1)?'iPadOS（Macintosh UA+タッチ。推定）':'macOS';
  else if(/Android/.test(ua))os='Android';else if(/Linux/.test(ua))os='Linux';
  const w=window;
  return {browser:b,browserVersion:v,os,userAgent:ua,
    secure:{isSecureContext:w.isSecureContext===true,protocol:location.protocol,isHttps:location.protocol==='https:'},
    features:{videoEncoder:typeof w.VideoEncoder==='function',audioEncoder:typeof w.AudioEncoder==='function',mediaCapabilities:!!(navigator.mediaCapabilities&&navigator.mediaCapabilities.decodingInfo),
      videoDecoder:typeof w.VideoDecoder==='function',audioDecoder:typeof w.AudioDecoder==='function',
      requestVideoFrameCallback:'requestVideoFrameCallback' in HTMLVideoElement.prototype,
      createImageBitmap:typeof w.createImageBitmap==='function',imageDecoder:typeof w.ImageDecoder==='function',
      imgDecode:'decode' in HTMLImageElement.prototype,audioContext:!!(w.AudioContext||w.webkitAudioContext)}};
}
const ENV=detectEnv();
let MB=null;const MBINFO={version:MB_VER,loaded:false,source:null,error:null,loadMs:null};
async function loadMB(){
  const t=now();const errs=[];
  for(const src of MB_SOURCES){
    try{
      const mod=await Promise.race([import(src),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),TO.mbLoad))]);
      if(!mod||!mod.Input||!mod.BlobSource)throw new Error('Input/BlobSource が見つからない');
      MB=mod;MBINFO.loaded=true;MBINFO.source=src;MBINFO.loadMs=ms(now()-t);break;
    }catch(e){errs.push(src+' → '+errStr(e))}
  }
  if(!MB)MBINFO.error=errs.join(' | ');
  renderEnv();
}
function renderEnv(){
  const f=ENV.features,se=ENV.secure;
  $('#envChips').innerHTML=[chip('HTTPS',se.isHttps),chip('isSecureContext',se.isSecureContext),chip('VideoDecoder',f.videoDecoder),chip('VideoEncoder',f.videoEncoder),chip('AudioDecoder',f.audioDecoder),chip('AudioEncoder',f.audioEncoder),chip('MediaCapabilities',f.mediaCapabilities),chip('rVFC',f.requestVideoFrameCallback),chip('ImageDecoder',f.imageDecoder),chip('ライブラリ',MBINFO.loaded?true:(MBINFO.error?false:'u'))].join('');
  $('#secWarn').hidden=se.isSecureContext;
  $('#envBox').innerHTML='<table class="kv">'+[
    ['ブラウザ',ENV.browser+' '+ENV.browserVersion],['OS（UAからの推定）',ENV.os],['User-Agent',ENV.userAgent],
    ['プロトコル / HTTPS / isSecureContext',ENV.secure.protocol+' / '+ENV.secure.isHttps+' / '+ENV.secure.isSecureContext],
    ['MediaCapabilities',f.mediaCapabilities],['WebCodecs VideoDecoder / VideoEncoder',f.videoDecoder+' / '+f.videoEncoder],['WebCodecs AudioDecoder / AudioEncoder',f.audioDecoder+' / '+f.audioEncoder],
    ['requestVideoFrameCallback',f.requestVideoFrameCallback],['createImageBitmap / img.decode()',f.createImageBitmap+' / '+f.imgDecode],
    ['Mediabunny '+MB_VER+' (MPL-2.0)',MBINFO.loaded?('読込済 '+MBINFO.loadMs+'ms ← '+MBINFO.source):(MBINFO.error?'読込失敗（標準APIのみで検査）: '+MBINFO.error:'読込中…')]
  ].map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</table>';
}

/* ============ FileSniffer ============ */
const ascii=(b,o,n)=>{let s='';for(let i=o;i<o+n&&i<b.length;i++)s+=String.fromCharCode(b[i]);return s};
const u32=(b,o)=>((b[o]<<24)|(b[o+1]<<16)|(b[o+2]<<8)|b[o+3])>>>0;
const u16le=(b,o)=>b[o]|(b[o+1]<<8), u32le=(b,o)=>(b[o]|(b[o+1]<<8)|(b[o+2]<<16)|(b[o+3]<<24))>>>0;
const IMG_FAM=new Set(['jpeg','png','gif','webp','bmp','tiff','svg','heic','avif','jxl','ico']);
const AUD_FAM=new Set(['mp3','wav','flac','adts','aiff','caf','ac3','dts']);
const PARSEABLE=new Set(['mp4','mov','3gp','m4a','webm','matroska','ogg','mp3','wav','flac','adts','mpegts']);
const EXT_FAM={jpg:'jpeg',jpeg:'jpeg',jfif:'jpeg',png:'png',gif:'gif',webp:'webp',bmp:'bmp',tif:'tiff',tiff:'tiff',svg:'svg',heic:'heic',heif:'heic',heics:'heic',avif:'avif',jxl:'jxl',ico:'ico',
  mp4:'isobmff',m4v:'isobmff',mov:'isobmff',m4a:'isobmff',m4b:'isobmff','3gp':'isobmff','3g2':'isobmff',webm:'webm',mkv:'matroska',mka:'matroska',ogv:'ogg',ogg:'ogg',oga:'ogg',opus:'ogg',
  mp3:'mp3',wav:'wav',wave:'wav',flac:'flac',aac:'adts',aif:'aiff',aiff:'aiff',caf:'caf',ac3:'ac3',eac3:'ac3',dts:'dts',ts:'mpegts',m2ts:'mpegts',mts:'mpegts',avi:'avi',wmv:'asf',wma:'asf',asf:'asf',flv:'flv'};
const famGroup=f=>['mp4','mov','3gp','m4a'].includes(f)?'isobmff':f;
const AUDIO_EXT=new Set(['mp3','wav','wave','m4a','m4b','aac','flac','ogg','oga','opus','aif','aiff','caf','ac3','eac3','dts','mka','wma']);
function getExt(n){const i=n.lastIndexOf('.');return i>=0?n.slice(i+1).toLowerCase():''}

function parseExifOrientation(b){
  if(b[0]!==0xFF||b[1]!==0xD8)return null;let o=2;
  while(o+4<b.length){
    if(b[o]!==0xFF)return null;const mk=b[o+1];if(mk===0xDA)return null;
    const len=(b[o+2]<<8)|b[o+3];
    if(mk===0xE1&&ascii(b,o+4,4)==='Exif'){
      const t=o+10,le=ascii(b,t,2)==='II';
      const r16=p=>le?(b[p]|(b[p+1]<<8)):((b[p]<<8)|b[p+1]);
      const r32=p=>le?u32le(b,p):u32(b,p);
      const ifd=t+r32(t+4);if(ifd+2>b.length)return null;
      const n=r16(ifd);
      for(let i=0;i<n;i++){const e=ifd+2+i*12;if(e+12>b.length)break;if(r16(e)===0x0112)return r16(e+8)}
      return 0; // EXIFはあるがOrientationタグ無し
    }
    o+=2+len;
  }
  return null;
}
async function gifFrames(file){ // ブロック構造を先頭2MBまで走査し、2フレーム目が見つかれば動画GIF
  const b=new Uint8Array(await file.slice(0,2*1048576).arrayBuffer());let o=13;
  if(b.length<14)return null;
  if(b[10]&0x80)o+=3*(1<<((b[10]&7)+1));
  let frames=0;
  while(o<b.length){
    const t=b[o];
    if(t===0x3B)return {frames,complete:true};
    if(t===0x21){o+=2;while(o<b.length&&b[o]!==0){o+=b[o]+1}o++;continue}
    if(t===0x2C){frames++;if(frames>=2)return {frames,complete:false};
      const f=b[o+9];o+=10;if(f&0x80)o+=3*(1<<((f&7)+1));o++;
      while(o<b.length&&b[o]!==0){o+=b[o]+1}o++;continue}
    return null;
  }
  return {frames,complete:false,truncated:true};
}
async function sniff(file){
  const b=new Uint8Array(await file.slice(0,65536).arrayBuffer());
  const r={family:'unknown',kind:'unknown',label:'不明',details:{},bytesRead:b.length};
  const set=(family,kind,label)=>{r.family=family;r.kind=kind;r.label=label};
  const ext=getExt(file.name);
  if(b.length<4){r.label='サイズ不足';return r}
  if(b[0]===0xFF&&b[1]===0xD8&&b[2]===0xFF){set('jpeg','image','JPEG');const o=parseExifOrientation(b);r.details.exifOrientation=o===null?null:o;
    for(let q=2;q+9<b.length&&b[q]===0xFF;){const mk=b[q+1];if(mk>=0xC0&&mk<=0xCF&&mk!==0xC4&&mk!==0xC8&&mk!==0xCC){r.details.rawHeight=(b[q+5]<<8)|b[q+6];r.details.rawWidth=(b[q+7]<<8)|b[q+8];break}q+=2+((b[q+2]<<8)|b[q+3])}}
  else if(u32(b,0)===0x89504E47){set('png','image','PNG');
    const ct=b[25];r.details.colorType=ct;r.details.bitDepth=b[24];
    let p=8,trns=false,actl=false;while(p+8<b.length){const ty=ascii(b,p+4,4);if(ty==='tRNS')trns=true;if(ty==='acTL')actl=true;if(ty==='IDAT')break;p+=12+u32(b,p)}
    r.details.headerAlpha=(ct===4||ct===6||trns);r.details.animated=actl}
  else if(ascii(b,0,3)==='GIF'){set('gif','image','GIF'+ascii(b,3,3));r.details.width=u16le(b,6);r.details.height=u16le(b,8)}
  else if(ascii(b,0,4)==='RIFF'&&ascii(b,8,4)==='WEBP'){set('webp','image','WebP');
    const ck=ascii(b,12,4);r.details.chunk=ck;
    if(ck==='VP8X'){r.details.headerAlpha=!!(b[20]&0x10);r.details.animated=!!(b[20]&0x02)}
    else if(ck==='VP8L'){r.details.headerAlpha=!!(b[24]&0x10);r.details.animated=false}
    else if(ck==='VP8 '){r.details.headerAlpha=false;r.details.animated=false}}
  else if(b[0]===0x42&&b[1]===0x4D&&ext==='bmp'){set('bmp','image','BMP')}
  else if((ascii(b,0,2)==='II'&&b[2]===42&&b[3]===0)||(ascii(b,0,2)==='MM'&&b[2]===0&&b[3]===42)){set('tiff','image','TIFF')}
  else if(b[0]===0xFF&&b[1]===0x0A||u32(b,0)===0x0000000C&&ascii(b,4,4)==='JXL '){set('jxl','image','JPEG XL')}
  else if(ascii(b,4,4)==='ftyp'){
    const brand=ascii(b,8,4);const sz=u32(b,0);const compat=[];for(let p=16;p+4<=Math.min(sz,b.length);p+=4)compat.push(ascii(b,p,4));
    r.details.brand=brand;r.details.compatible=compat;const all=[brand].concat(compat);
    if(['avif','avis'].includes(brand)){set('avif','image','AVIF ('+brand+')');r.details.animated=brand==='avis'}
    else if(['heic','heix','heim','heis','hevc','hevx','mif1','msf1'].includes(brand)&&!all.includes('isom')&&!all.includes('mp42')){set('heic','image','HEIC/HEIF ('+brand+')');r.details.animated=(brand==='msf1'||brand==='hevc')}
    else if(brand==='qt  ')set('mov','av','QuickTime MOV');
    else if(/^3g/.test(brand))set('3gp','av','3GP/3G2 ('+brand+')');
    else if(brand==='M4A '||brand==='M4B ')set('m4a','av','M4A/M4B（ISOBMFF。映像有無は解析後に判定）');
    else set('mp4','av','MP4/ISOBMFF (brand '+brand+')');
  }
  else if(u32(b,0)===0x1A45DFA3){const s=ascii(b,0,64);if(s.indexOf('webm')>=0)set('webm','av','WebM (EBML)');else if(s.indexOf('matroska')>=0)set('matroska','av','Matroska/MKV (EBML)');else set('matroska','av','EBML (DocType不明)')}
  else if(ascii(b,0,4)==='OggS'){const s=ascii(b,0,120);let c='不明';
    if(s.indexOf('OpusHead')>=0)c='Opus';else if(s.indexOf('vorbis')>=0)c='Vorbis';else if(s.indexOf('FLAC')>=0)c='FLAC';else if(s.indexOf('theora')>=0)c='Theora';
    r.details.firstCodecHint=c;set('ogg',c==='Theora'?'av':'audio','Ogg ('+c+')')}
  else if(ascii(b,0,4)==='fLaC')set('flac','audio','FLAC');
  else if(ascii(b,0,4)==='RIFF'&&ascii(b,8,4)==='WAVE'){set('wav','audio','WAV');
    let p=12;while(p+8<b.length){const id=ascii(b,p,4),sz=u32le(b,p+4);
      if(id==='fmt '){let tag=u16le(b,p+8);const ch=u16le(b,p+10),sr=u32le(b,p+12),br=u32le(b,p+16),bits=u16le(b,p+22);
        if(tag===0xFFFE&&sz>=26)tag=u16le(b,p+32);
        Object.assign(r.details,{formatTag:tag,formatName:{1:'PCM',3:'IEEE float',6:'A-law',7:'μ-law',0x55:'MP3',0x11:'IMA ADPCM',2:'MS ADPCM'}[tag]||('tag 0x'+tag.toString(16)),channels:ch,sampleRate:sr,byteRate:br,bitsPerSample:bits})}
      if(id==='data'){r.details.dataBytes=sz;break}
      p+=8+sz+(sz&1)}}
  else if(ascii(b,0,4)==='RIFF'&&ascii(b,8,4)==='AVI ')set('avi','av','AVI');
  else if(ascii(b,0,4)==='FORM'&&/AIF[FC]/.test(ascii(b,8,4)))set('aiff','audio','AIFF/AIFC');
  else if(ascii(b,0,4)==='caff')set('caf','audio','CAF');
  else if(ascii(b,0,3)==='FLV')set('flv','av','FLV');
  else if(b[0]===0x30&&b[1]===0x26&&b[2]===0xB2&&b[3]===0x75)set('asf','av','ASF (WMV/WMA)');
  else if(b[0]===0x0B&&b[1]===0x77)set('ac3','audio','AC-3');
  else if(u32(b,0)===0x7FFE8001)set('dts','audio','DTS');
  else if(ascii(b,0,3)==='ID3'){set('mp3','audio','MP3 (ID3タグ付き。本体種別は解析で確認)');r.details.id3=true}
  else if(b[0]===0xFF&&(b[1]&0xE0)===0xE0){
    const layer=(b[1]>>1)&3;
    if(layer===0&&(b[1]&0xF6)===0xF0)set('adts','audio','AAC (ADTS)');else if(layer===1)set('mp3','audio','MP3 (MPEGフレーム)');else set('mp3','audio','MPEG Audio (layer '+(4-layer)+')')}

/* ============ 音声 ============ */
async function verifyAudioMeta(it,rep){
  const V=rep.verify={method:'HTMLAudioElement',loaded:false,events:{},playbackTest:'not-run'};
  const a=new Audio();a.preload='auto';a.muted=false;const url=mkUrl(it.file),t0=now();
  const mark=n=>{if(V.events[n]==null)V.events[n]=ms(now()-t0)};['loadstart','loadedmetadata','loadeddata','canplay'].forEach(n=>a.addEventListener(n,()=>mark(n)));
  try{
    a.src=url;const m=await waitMeta(a,TO.meta);
    if(!m.ok){V.error=m.error||null;V.timeout=!!m.timeout;return}
    V.loaded=true;V.duration=isFinite(a.duration)?a.duration:null;
    const c=await once(a,'canplay',a.readyState>=3?1:TO.canplay);
    V.canplayFired=c||a.readyState>=3;
    if(!V.canplayFired)V.canplayNote='canplay未発火（iPad等は操作前に先読みしない場合あり。失敗とは限らない）';
  }finally{a.pause();a.removeAttribute('src');try{a.load()}catch(e){}rmUrl(url);V.totalMs=ms(now()-t0)}
}
let listen=null;
function stopListen(reason){
  if(!listen)return;const L=listen;listen=null;clearTimeout(L.timer);clearInterval(L.poll);
  try{L.a.pause()}catch(e){}L.a.removeAttribute('src');try{L.a.load()}catch(e){}rmUrl(L.url);
  L.it.listening=false;
  const V=L.it.report.verify;V.listenEndedMs=ms(now()-L.t0);
  if(V.playbackTest==='running'){
    if(L.progressed){V.playbackTest='ok';delete V.playError;delete V.playNote}
    else if(reason==='user'&&!V.playError){V.playbackTest='not-run';V.playNote='0.25秒未満で停止したため判定せず。もう一度「音を確認」を押してください'}
    else{V.playbackTest='failed';if(!V.playError)V.playError='再生位置が進まなかった'}
  }
  finalize(L.it.report);render(L.it);
}
function startListen(it){ // クリックハンドラ内で同期的に呼ぶ（iOSのユーザー操作要件）
  stopListen('user');
  const rep=it.report,V=rep.verify;delete V.playError;delete V.playNote;const a=new Audio();a.preload='auto';const url=mkUrl(it.file);
  const L=listen={it,a,url,t0:now(),progressed:false,timer:null,poll:null};
  V.playbackTest='running';V.playbackStartedByUser=true;V.listenLimitMs=LISTEN_MS;it.listening=true;a.src=url;
  const p=a.play();
  if(p&&p.then)p.then(()=>{V.playStarted=true},e=>{V.playError=errStr(e);if(listen===L)stopListen('error')});
  L.poll=setInterval(()=>{if(a.currentTime>0.25){L.progressed=true;V.currentTimeReached=+a.currentTime.toFixed(3)}},100);
  L.timer=setTimeout(()=>{if(listen===L){V.currentTimeReached=+a.currentTime.toFixed(3);if(a.currentTime>0.25)L.progressed=true;stopListen('timeout')}},LISTEN_MS);
  a.addEventListener('error',()=>{V.playError=JSON.stringify(mediaErr(a));if(listen===L)stopListen('error')},{once:true});
  a.addEventListener('ended',()=>{if(listen===L){L.progressed=L.progressed||a.currentTime>0.1;stopListen('ended')}},{once:true});
  render(it);
}

/* ============ 判定 ============ */
const ST_TEXT={'native-ready':'標準経路で実際に表示/再生を確認','native-limited':'動作するが制限あり','proxy-ready':'（予約・今回は未実装）','conversion-required':'直接処理できず変換が必要','unsupported':'この環境では処理できない','probe-failed':'破損・解析失敗・読込エラー','awaiting-user-playback':'試聴待ち（「音を確認」を押すと確定）'};

  const P=rep.parser||{},V=rep.verify||{},lim=[];const fam=rep.sniff.family;
  rep.warnings=(rep.warnings||[]).filter(w=>w.indexOf('[判定]')!==0);
  const mis=(k,l)=>{const qs=((rep.capabilities||{}).mediaCapabilities||[]).filter(q=>q.kind===k&&q.supported!=null);
    if(qs.length&&qs.every(q=>q.supported===false))rep.warnings.push('[判定] MediaCapabilitiesは'+l+'を非対応と予測したが、実際には読込/再生できた（予測は参考値。実測を優先）')};
  const D=rep.diagnosis={recognized:fam!=='unknown',parsed:P.attempted?P.ok:null,browserLoaded:V.loaded===undefined?null:V.loaded,

  const parseFailText=()=>P.attempted?('解析ライブラリが読めない: '+P.error):'解析ライブラリ未使用（標準APIのみ）';
  if(rep.kind==='video'){
    const vt=(P.tracks||[]).filter(t=>t.kind==='video'),at=(P.tracks||[]).filter(t=>t.kind==='audio');
    D.embeddedAudioTrackDetected=P.ok?at.length>0:null;
    D.ptsFromParser=P.ok?(vt.some(t=>t.pts&&t.pts.ok)?'ok':'unavailable'):null;
    if(!V.loaded){
      if(P.ok){st='conversion-required';code='browser-cannot-decode';text='コンテナは解析できたが、このブラウザは読み込み/デコードできない'+(V.error?'（'+V.error.name+'）':V.timeout?'（タイムアウト）':'')}
      else if(PARSEABLE.has(fam)){st='probe-failed';code='parse-failed';text='解析もブラウザ読込も失敗。破損または非標準ファイルの可能性。'+parseFailText()}
      else if(fam!=='unknown'){st='conversion-required';code='browser-cannot-decode';text=rep.sniff.label+'は認識できたが、解析もブラウザ再生もできない。将来の変換経路が必要'}
      else{st='unsupported';code='unrecognized-format';text='形式を認識できず、ブラウザも読み込めない'}
    }else if(V.noVideoTrack&&V.parserHasVideoTrack){st='conversion-required';code='browser-cannot-decode';text='映像トラックは解析できたが、このブラウザは映像をデコードできない（音声だけ読み込まれた）。映像コーデック: '+((vt[0]&&vt[0].codec)||UNK)}
    else if(V.noVideoTrack){st='native-limited';code='no-video-track';text='映像トラックが無い（音声のみ）として読み込まれた';lim.push('映像なし')}
    else{
      const ff=V.firstFrame||{};D.firstFramePresented=ff.mediaTimeAvailable?true:(ff.drawn?'drawn-only':false);
      D.ptsPresentedByBrowser=ff.mediaTimeAvailable?'ok':'unavailable';
      D.playback='not-tested-in-step-a(muted preview only)';
      if(!ff.drawn&&!ff.mediaTimeAvailable){st='conversion-required';code='browser-cannot-decode';text='メタデータは読めたが映像フレームを表示できなかった'}
      else{
        if(!ff.mediaTimeAvailable)lim.push('提示フレームの時刻(mediaTime)が取得できない（rVFC未対応/未発火）。PTS確認不可');
        const bad=(V.seeks||[]).filter(s=>!s.seekedFired||!s.withinTolerance);
        if(bad.length)lim.push('シークテストで'+bad.length+'/'+V.seeks.length+'件が許容差を超えた/未完了');
        const mc=(rep.capabilities.mediaCapabilities||[]).filter(q=>q.kind==='video'&&q.supported===true);
        if(mc.some(q=>q.smooth===false))lim.push('MediaCapabilities: smooth=false（滑らかな再生が見込めない）');
        if(vt.some(t=>t.pts&&t.pts.likelyVfr))lim.push('VFRの可能性（フレーム位置は平均FPSでなくPTSで扱う必要あり。VFRではシーク差が出やすい）');
        if(at.length){const mcA=(rep.capabilities.mediaCapabilities||[]).filter(q=>q.kind==='audio'&&q.supported!=null);
          const cpA=(rep.capabilities.canPlayType||[]).filter(c=>c.role==='audio-track');

        mis('video','映像');

        const v0=vt[0];if(v0&&v0.displayWidth&&V.videoWidth&&(V.videoWidth!==v0.displayWidth||V.videoHeight!==v0.displayHeight))rep.warnings.push('要素の寸法('+V.videoWidth+'×'+V.videoHeight+')が解析の表示サイズ('+v0.displayWidth+'×'+v0.displayHeight+')と異なる。回転の二重適用/未適用・画素アスペクト比を確認');

        text=lim.length?'表示・シークは動作したが制限あり':'メタデータ読込・先頭フレーム表示・シークを確認（フレーム精度は未検証=Step B）';
      }
    }

      else if(fam==='gif'&&!rep.gifFrames)lim.push('GIF：アニメーションか否か未確定。静止画（先頭フレーム）として扱う');
      if(I.bitmap&&I.bitmap.ok===false)rep.warnings.push('createImageBitmapは失敗: '+I.bitmap.error);

    }else if(I.bitmap&&I.bitmap.ok&&!I.decodedOk){st='native-limited';code='img-element-failed';text='<img>では表示不可だがcreateImageBitmapは成功';lim.push('imgで表示不可')}

    else if(fam!=='unknown'){st='conversion-required';code='browser-cannot-decode';text=rep.sniff.label+'は認識できたが、このブラウザはデコードできない（'+(I.decodeError||'')+'）'}
    else{st='unsupported';code='unrecognized-format';text='画像として認識・デコードできない'}
    D.browserLoaded=!!I.decodedOk;D.firstFramePresented=I.displayed===true;
  }else if(rep.kind==='audio'){

      if(P.ok){st='conversion-required';code='browser-cannot-decode';text='コンテナ/コーデックは解析できたが、このブラウザは再生できない'+(V.error?'（'+V.error.name+'）':'')}
      else if(PARSEABLE.has(fam)){st='probe-failed';code='parse-failed';text='解析もブラウザ読込も失敗。破損の可能性。'+parseFailText()}
      else if(fam!=='unknown'){st='conversion-required';code='browser-cannot-decode';text=rep.sniff.label+'は認識できたが再生できない。将来の変換経路が必要'}
      else{st='unsupported';code='unrecognized-format';text='形式を認識できず、ブラウザも読み込めない'}

    else if(V.playbackTest==='failed'){st='conversion-required';code='playback-failed';text='メタデータは読めたが、実再生に失敗/進行しなかった（'+(V.playError||'')+'）'}

      if(at.some(t=>(t.channels||0)>2))lim.push('3ch以上（初期ミキサーでは要ダウンミックス）');
      st=lim.length?'native-limited':'native-ready';code=lim.length?'ok-with-limits':'ok';
      mis('audio','音声');

/* ============ 1ファイルの検査 ============ */
function pickKind(rep,file){
  const P=rep.parser,s=rep.sniff;
  if(P&&P.ok){if(P.hasVideoTrack)return ['video','解析結果（映像トラックあり）'];if(P.hasAudioTrack)return ['audio','解析結果（音声トラックのみ）']}
  if(IMG_FAM.has(s.family))return ['image','シグネチャ'];
  if(AUD_FAM.has(s.family))return ['audio','シグネチャ'];
  if(s.family==='ogg'&&s.kind==='audio')return ['audio','シグネチャ(Ogg音声)'];
  const mt=(file.type||'').split('/')[0],ext=getExt(file.name);
  if(s.kind==='av'){if(mt==='audio'||AUDIO_EXT.has(ext))return ['audio','MIME/拡張子からの推定（解析不可のため）'];return ['video','シグネチャ(コンテナ)+拡張子からの推定']}
  if(['video','audio','image'].includes(mt))return [mt,'File.type（シグネチャ不明）'];
  return ['unknown','判定材料なし'];
}
async function inspect(it){
  const f=it.file,rep=it.report={id:it.id,file:{name:f.name,sizeBytes:f.size,extension:getExt(f.name),mimeType:f.type||null},
    sniff:null,kind:null,kindSource:null,parser:null,capabilities:null,verify:null,diagnosis:null,
    status:'running',statusLabel:'',reasonCode:null,reasonText:null,limitations:[],warnings:[],errors:[],timingsMs:{}};
  const T=rep.timingsMs,t0=now();let t=now();
  try{
    rep.sniff=await sniff(f);T.sniff=ms(now()-t);
    if(rep.sniff.mismatch)rep.warnings.push(rep.sniff.mismatch);
    if(rep.sniff.family==='gif'){try{rep.gifFrames=await gifFrames(f)}catch(e){}}
    const needParse=['av','audio'].includes(rep.sniff.kind)||rep.sniff.kind==='unknown'&&(f.type.startsWith('video/')||f.type.startsWith('audio/')||EXT_FAM[getExt(f.name)]&&!IMG_FAM.has(EXT_FAM[getExt(f.name)]));
    t=now();
    if(needParse){it.stage='コンテナ解析中';render(it);await parseMB(f,rep)}
    else rep.parser={lib:'mediabunny',attempted:false,ok:null,note:'画像は解析ライブラリ不要（シグネチャ+実デコードで検査）'};
    T.parse=ms(now()-t);
    [rep.kind,rep.kindSource]=pickKind(rep,f);
    if(rep.parser&&rep.parser.ok===false&&rep.parser.attempted)rep.warnings.push('解析できない: '+rep.parser.error);
    if(rep.kind==='audio'&&rep.sniff.family==='wav'){rep.wavHeader=wavExtras(rep)}
    t=now();
    if(rep.kind==='video'||rep.kind==='audio'){it.stage='ブラウザ能力検査中';render(it);await capProbe(rep,f)}
    else rep.capabilities={canPlayType:[],mediaCapabilities:[],note:'画像はcanPlayType/MediaCapabilities対象外'};
    T.capabilities=ms(now()-t);t=now();
    it.stage='実読込・表示検証中';render(it);
    if(rep.kind==='video')await verifyVideo(it,rep);
    else if(rep.kind==='image')await verifyImage(it,rep);
    else if(rep.kind==='audio')await verifyAudioMeta(it,rep);
    T.verify=ms(now()-t);
  }catch(e){rep.errors.push('検査中の例外: '+errStr(e));rep.reasonCode='exception'}
  T.total=ms(now()-t0);
  if(rep.errors.length&&!rep.verify){rep.status='probe-failed';rep.statusLabel=ST_TEXT['probe-failed'];rep.reasonText=rep.errors[0]}
  else finalize(rep);
  it.stage='';render(it);
}

/* ============ キュー（1ファイルずつ） ============ */
const items=[];let seq=0,busy=false;
function addFiles(fl){for(const f of fl){const it={id:'f'+(++seq),file:f,thumb:null,pv:document.createElement('div'),stage:'待機中',report:{id:'f'+seq,file:{name:f.name,sizeBytes:f.size,extension:getExt(f.name),mimeType:f.type||null},status:'queued'}};
  it.pv.className='pvwrap';items.push(it);const c=document.createElement('div');c.className='card';c.id='c-'+it.id;it.node=c;$('#list').appendChild(c);render(it)}
  pump()}
async function pump(){if(busy)return;busy=true;
  try{for(;;){const it=items.find(x=>x.report.status==='queued');if(!it)break;it.report.status='running';await inspect(it)}}finally{busy=false}}
function removeItem(id){const i=items.findIndex(x=>x.id===id);if(i<0)return;const it=items[i];if(listen&&listen.it===it)stopListen();
  if(it.report.status==='running'){return}
  it.node.remove();it.thumb=null;it.pv.replaceChildren();items.splice(i,1)}
function rerun(id){const it=items.find(x=>x.id===id);if(!it||it.report.status==='running')return;if(listen&&listen.it===it)stopListen();
  it.thumb=null;it.pv.replaceChildren();it.report={id:it.id,file:it.report.file,status:'queued'};it.stage='待機中';render(it);pump()}

/* ============ 表示 ============ */
const kv=(l,v)=>'<tr><td>'+esc(l)+'</td><td>'+((v==null||v==='')?'<span class="unk">'+UNK+'</span>':esc(v))+'</td></tr>';

const chip=(l,v)=>'<span class="chip '+(v===true||v==='ok'?'y':v===false?'n':'u')+'">'+(v===true||v==='ok'?'✔ ':v===false?'✖ ':'– ')+esc(l)+'</span>';

     (r.kind==='video'?chip('先頭フレーム表示',D.firstFramePresented===true?true:D.firstFramePresented===false?false:'u')+chip('提示PTS取得',D.ptsPresentedByBrowser==='ok'?true:D.ptsPresentedByBrowser==='unavailable'?false:'u')+chip('パーサPTS',D.ptsFromParser==='ok'?true:D.ptsFromParser==='unavailable'?false:'u')+chip('内蔵音声トラック検出',D.embeddedAudioTrackDetected===null||D.embeddedAudioTrackDetected===undefined?'u':D.embeddedAudioTrackDetected):'')+
     (r.kind==='audio'?chip('実再生',r.verify&&r.verify.playbackTest==='ok'?true:r.verify&&r.verify.playbackTest==='failed'?false:'u'):'')+'</div>';

function renderBody(it,r){

  }
  h+='<button class="sec" data-act="rerun" data-id="'+it.id+'">再検査</button><button class="sec" data-act="remove" data-id="'+it.id+'">削除</button></div>';
  if(r.kind==='audio'&&V.playbackTest==='ok')h+='<small>聞こえたか回答すると記録されます（未回答でも可）。'+(V.userHeard==null?'':'回答: '+(V.userHeard?'聞こえた':'聞こえない'))+'</small>';
  // 1 判別
  h+='<details open><summary>① ファイル判別（拡張子・MIME・シグネチャ）</summary>'+tbl([
    kv('検出した種類',r.kind+'（'+r.kindSource+'）'),kv('シグネチャ判定',S.label),kv('拡張子→形式',S.extFamily),
    kv('ftyp brand',S.details&&S.details.brand),kv('EXIF Orientation',S.details&&S.details.exifOrientation),
    kv('ヘッダ上のアルファ',S.details&&S.details.headerAlpha!=null?yn(S.details.headerAlpha):null),
    kv('アニメーション(ヘッダ)',S.details&&S.details.animated!=null?yn(S.details.animated):(r.gifFrames?(r.gifFrames.frames>1?'はい(2フレーム以上)':(r.gifFrames.complete?'いいえ(1フレーム)':'未確定')):null)),
    r.wavHeader?kv('WAVヘッダ',r.wavHeader.formatName+' / '+r.wavHeader.bitsPerSample+'bit / '+r.wavHeader.channels+'ch / '+r.wavHeader.sampleRate+'Hz'):'',
    S.mismatch?'<tr><td class="warn">不一致</td><td class="warn">'+esc(S.mismatch)+'</td></tr>':''
  ])+'</details>';
  // 2 解析
  if(P.attempted!==false||P.error){
    h+='<details open><summary>② 解析結果（Mediabunny '+esc(MB_VER)+'・コンテナ解析のみ。デコード可否ではない）</summary>';
    if(P.ok){
      h+=tbl([kv('コンテナ',P.container),kv('MIME(解析)',P.mimeType),kv('長さ',P.durationSec!=null?fmtDur(P.durationSec)+' ['+P.durationSource+']':null),
        kv('メタデータタグ(キー名のみ)',P.metadataTagKeys.length?P.metadataTagKeys.join(', '):'なし')]);
      if(!P.tracks.length)h+='<small class="warn">トラックが見つからない</small>';
      for(const T of P.tracks){
        const emb=r.kind==='video'&&T.kind==='audio';
        h+='<div class="trk '+(T.kind==='audio'?'aud':'')+'"><b>'+(T.kind==='video'?'映像トラック':(emb?'動画内蔵の音声トラック':'独立音声ファイルの音声トラック'))+' #'+T.index+'</b>';
        const rows=[kv('codec',T.codec),kv('codec文字列',T.codecParam),kv('言語',T.language==='und'?null:T.language),kv('bitrate(メタデータ)',T.bitrate!=null?Math.round(T.bitrate/1000)+' kbps':null),kv('平均bitrate',T.avgBitrate!=null?Math.round(T.avgBitrate/1000)+' kbps':null)];
        if(T.kind==='video'){
          rows.push(kv('符号化サイズ',T.codedWidth?T.codedWidth+'×'+T.codedHeight:null),kv('表示サイズ(解析)',T.displayWidth?T.displayWidth+'×'+T.displayHeight:null),kv('回転',T.rotation!=null?T.rotation+'°'+(T.flip?' +反転':''):null),
            kv('FPS（先頭サンプル）',T.fpsSampled!=null?T.fpsSampled.toFixed(3):null));
          const p=T.pts;if(p&&p.ok){rows.push(kv('PTS先頭(解析)',p.firstTimestampSec+'s'),kv('サンプルpacket数',p.sampledPackets),kv('間隔中央値→FPS推定',p.estimatedFps?p.estimatedFps.toFixed(3):null),kv('VFR推定',p.likelyVfr===null?'判定不能(サンプル不足)':(p.likelyVfr?'VFRの可能性あり':'CFRらしい')+'（外れ値率 '+p.deviatingRatio+'）'),kv('最大キーフレーム間隔(packet)',p.maxKeyframeGapPackets))}
          else rows.push(kv('PTS情報(解析)','取得不可'+(p&&p.error?': '+p.error:'')));
        }else{rows.push(kv('チャンネル数',T.channels),kv('サンプルレート',T.sampleRate?T.sampleRate+' Hz':null),kv('ビット深度',r.wavHeader?r.wavHeader.bitsPerSample+' bit(WAVヘッダ)':null))}
        rows.push(kv('WebCodecs isConfigSupported',T.webCodecsIsConfigSupported?(T.webCodecsIsConfigSupported.supported===null?'未提供/不明':String(T.webCodecsIsConfigSupported.supported)):null));
        if(T.errors)rows.push('<tr><td class="warn">取得エラー</td><td class="warn">'+esc(T.errors.join(' / '))+'</td></tr>');
        h+=tbl(rows)+'</div>';
      }
    }else h+='<div class="err">'+esc(P.error||'解析できなかった')+'</div><small>解析不可でも、ブラウザが読めるかは④で別途検査しています。</small>';
    h+='</details>';
  }
  // 3 能力
  if(r.kind==='video'||r.kind==='audio'){
    h+='<details><summary>③ ブラウザ能力（予測のみ。再生保証ではない）</summary>';
    h+='<b>canPlayType</b>'+tbl((C.canPlayType||[]).map(x=>kv(x.type+' ['+x.source+']',x.result)));
    h+='<b>MediaCapabilities.decodingInfo</b>'+tbl((C.mediaCapabilities||[]).map(q=>kv('トラック#'+(q.track!=null?q.track:'-')+' '+(q.kind||'')+(q.alt?' ['+q.alt+']':''),q.error?'エラー: '+q.error:q.note?q.note:'supported='+q.supported+' / smooth='+q.smooth+' / powerEfficient='+q.powerEfficient+(q.inputsEstimated?' （bitrate/fps等に推定値を使用）':''))));
    h+='</details>';
  }
  // 4 実検証
  h+='<details open><summary>④ 実際の読込・表示・再生の結果</summary>';
  if(r.kind==='video'){
    const ff=V.firstFrame||{};
    h+=tbl([kv('読込(loadedmetadata)',yn(V.loaded)),kv('イベント(ms)',Object.entries(V.events||{}).map(e=>e[0]+':'+e[1]).join(' ')),kv('要素の寸法',V.videoWidth?V.videoWidth+'×'+V.videoHeight:null),kv('duration(要素)',V.duration!=null?fmtDur(V.duration):null),
      kv('先頭フレーム取得方式',ff.method),kv('提示mediaTime',ff.presentedMediaTime!=null?ff.presentedMediaTime+'s':(V.loaded?'取得不可':null)),kv('canvas描画',ff.drawn!=null?yn(ff.drawn):null),
      V.error?kv('エラー',JSON.stringify(V.error)):'',V.timeout?kv('タイムアウト','はい'):'',ff.blankWarning?'<tr><td class="warn">注意</td><td class="warn">'+esc(ff.blankWarning)+'</td></tr>':'']);
    if(V.seeks&&V.seeks.length)h+='<b>シークテスト（許容 ±'+V.seekToleranceSec+'s・Step B予備情報）</b>'+tbl(V.seeks.map(s=>kv('要求 '+s.requestedSec+'s','提示 '+(s.presentedMediaTime==null?'取得不可':s.presentedMediaTime+'s (差 '+s.deltaSec+'s)')+' / seeked='+yn(s.seekedFired)+' / '+s.seekMs+'ms / '+(s.withinTolerance?'許容内':'許容外'))));
    h+='<small>動画内蔵音声の再生確認はStep Aでは行いません（映像はミュート）。</small>';
  }else if(r.kind==='image'){
    h+=tbl([kv('デコード方式',V.decodeApi),kv('img表示成功',yn(V.decodedOk)),kv('寸法(img)',V.naturalWidth?V.naturalWidth+'×'+V.naturalHeight:null),kv('createImageBitmap',V.bitmap?(V.bitmap.ok?'成功 '+V.bitmap.width+'×'+V.bitmap.height:V.bitmap.ok===false?'失敗: '+V.bitmap.error:V.bitmap.note):null),
      kv('メガピクセル',V.megapixels),kv('EXIF向き',V.exifOrientation),kv('向きの扱い',V.orientationNote),
      kv('透過(ヘッダ宣言)',S.details&&S.details.headerAlpha!=null?yn(S.details.headerAlpha):null),kv('透過(サムネイルで観測)',V.observedTransparency!=null?yn(V.observedTransparency):null),
      V.decodeError?kv('decodeエラー',V.decodeError):'']);
    if(r.sniff.family==='gif'||(S.details&&S.details.animated))h+='<small class="warn">表示は先頭フレームの静止画です。アニメーションは保持しません。</small>';
    h+='<small>プレビューは縮小サムネイルです（元画像のフルデコードは検査後に破棄）。</small>';
  }else if(r.kind==='audio'){
    h+=tbl([kv('読込(loadedmetadata)',yn(V.loaded)),kv('canplay',V.canplayFired!=null?yn(V.canplayFired):null),kv('イベント(ms)',Object.entries(V.events||{}).map(e=>e[0]+':'+e[1]).join(' ')),kv('duration(要素)',V.duration!=null?fmtDur(V.duration):null),
      kv('実再生テスト',V.playbackTest),kv('再生到達位置',V.currentTimeReached!=null?V.currentTimeReached+'s':null),kv('可聴(利用者回答)',V.userHeard==null?'未回答':(V.userHeard?'聞こえた':'聞こえない')),
      V.canplayNote?'<tr><td>備考</td><td>'+esc(V.canplayNote)+'</td></tr>':'',V.playNote?'<tr><td>試聴の備考</td><td class="warn">'+esc(V.playNote)+'</td></tr>':'',V.error?kv('エラー',JSON.stringify(V.error)):'',V.playError?kv('再生エラー',V.playError):'']);
  }else h+='<small>検証対象外</small>';
  h+='</details>';
  // 5 判定
  h+='<details open><summary>⑤ 判定・警告・所要時間</summary>';
  if(r.limitations.length)h+='<div class="warn">制限: '+r.limitations.map(esc).join(' / ')+'</div>';
  if(r.warnings.length)h+='<div class="warn">警告: '+r.warnings.map(esc).join(' / ')+'</div>';
  if(r.errors.length)h+='<div class="err">エラー: '+r.errors.map(esc).join(' / ')+'</div>';
  h+='<small>所要時間(ms): '+esc(Object.entries(r.timingsMs).map(e=>e[0]+'='+e[1]).join(' '))+'</small></details>';
  return h;
}

/* ============ JSON ============ */
function buildReport(){
  return {schema:TOOL.schema,tool:{name:TOOL.name,version:TOOL.version},generatedAt:new Date().toISOString(),
    environment:{browser:ENV.browser,browserVersion:ENV.browserVersion,os:ENV.os,userAgent:ENV.userAgent,secureContext:ENV.secure,features:ENV.features,
      library:{name:'mediabunny',version:MB_VER,license:'MPL-2.0',loaded:MBINFO.loaded,source:MBINFO.source,error:MBINFO.error}},
    privacy:'ファイル本体・サムネイル・メタデータタグの値は含まない（タグはキー名のみ）',
    items:items.map(i=>i.report).filter(r=>r.status!=='queued'&&r.status!=='running')};
}
const jsonText=()=>JSON.stringify(buildReport(),null,2);
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}

/* ============ イベント ============ */
$('#fi').addEventListener('change',e=>{addFiles(Array.from(e.target.files));e.target.value=''});
const dz=$('#drop');
['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files)addFiles(Array.from(e.dataTransfer.files))});
$('#bClear').addEventListener('click',()=>{stopListen();for(const it of items.slice())if(it.report.status!=='running')removeItem(it.id)});
$('#bJson').addEventListener('click',()=>{
  const u=mkUrl(new Blob([jsonText()],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='media_probe_'+stamp()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>rmUrl(u),10000);
  $('#jsonView').hidden=false;$('#jsonView').textContent=jsonText();});
$('#bCopy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(jsonText());$('#bCopy').textContent='コピーしました'}catch(e){$('#jsonView').hidden=false;$('#jsonView').textContent=jsonText();$('#bCopy').textContent='コピー不可→下に表示'}setTimeout(()=>$('#bCopy').textContent='JSONコピー',2500)});
$('#bShow').addEventListener('click',()=>{const v=$('#jsonView');v.hidden=!v.hidden;if(!v.hidden)v.textContent=jsonText()});
$('#list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const it=items.find(x=>x.id===b.dataset.id);if(!it)return;
  const a=b.dataset.act;
  if(a==='listen')startListen(it);else if(a==='stop')stopListen('user');
  else if(a==='heard'||a==='nothear'){it.report.verify.userHeard=(a==='heard');finalize(it.report);render(it)}
  else if(a==='remove')removeItem(it.id);else if(a==='rerun')rerun(it.id)});
window.addEventListener('pagehide',()=>{stopListen();for(const u of Array.from(liveUrls))rmUrl(u)});
window.__probe={items,liveUrlCount:()=>liveUrls.size,buildReport,mbInfo:MBINFO,idle:()=>!busy&&!items.some(i=>i.report.status==='queued'||i.report.status==='running')};
renderEnv();updLive();loadMB();
</script>
</body></html>
