<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Probe B</title>
<style>:root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--bd:#8886}@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee}}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
button,input,select{font:inherit;padding:8px 10px;margin:3px 3px 3px 0}input[type=number]{width:4.5em}input[type=checkbox]{padding:0}
pre{white-space:pre-wrap;word-break:break-all;border:1px solid var(--bd);padding:8px;border-radius:6px;max-height:50vh;overflow:auto;font-size:12px}
video{max-width:160px;max-height:90px}small{opacity:.7}label{margin-right:10px;white-space:nowrap}h1{font-size:18px}#warn{color:#c60;font-weight:bold}</style></head><body>
<h1>Video Probe <small>Step B / v0.2.0 診断版</small></h1>
<p><small>映像エンジン検証。1回に1フェーズ・1ファイルずつ実行します。ファイルはブラウザ内だけで処理し、送信しません。保存するのは診断情報のみです（映像データは保存しません）。</small></p>
<input type="file" id="fi" accept="video/*,.mov,.mp4,.m4v,.webm" multiple><select id="fsel"></select><br>
<label><input type="checkbox" id="cSafe" checked>安全モード（既定ON）</label>
<label><input type="checkbox" id="cLuma">画素確認（GPU→CPU読み戻しあり／安全モード中は無効）</label><br>
<label>シーク回数<input type="number" id="nSeek" value="16" min="4" max="60"></label>
<label>再生秒<input type="number" id="nPlay" value="5" min="2" max="60"></label>
<label>負荷シーク<input type="number" id="nStress" value="100" min="20" max="500"></label>
<div id="btns"></div>
<button id="save">JSON保存</button><button id="reset">結果を消去</button>
<div id="warn"></div><div id="pv"></div><div id="stat"><small>環境確認中…</small></div><pre id="log"></pre>
<script>
'use strict';
const TOOL={name:'video_probe_b',version:'0.2.0',schema:'video-probe-b/2'};
const MB_VER='1.64.0',MB_SRC=['./vendor/mediabunny.min.mjs','https://cdn.jsdelivr.net/npm/mediabunny@'+MB_VER+'/dist/bundles/mediabunny.min.mjs'];
const PHASES=[['info','①情報（解析・対応確認）'],['seek','②シーク'],['rapid','③連続シーク'],['play','④再生'],['stress','⑤負荷シーク'],['recycle','⑥要素再生成'],['webcodecs','⑦WebCodecs']];
const $=id=>document.getElementById(id),now=()=>performance.now(),r3=x=>x==null?null:Math.round(x*1000)/1000,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const log=s=>{const e=$('log');e.textContent+=s+'\n';e.scrollTop=1e9},errS=e=>e&&e.name?e.name+': '+e.message:String(e);
let MB=null,urls=0,REPORT=null,FILES=[],busy=false;const mk=b=>{urls++;return URL.createObjectURL(b)},rm=u=>{urls--;URL.revokeObjectURL(u)};
const sorted=a=>[...a].sort((x,y)=>x-y),med=a=>a.length?sorted(a)[a.length>>1]:null,pct=(a,p)=>a.length?sorted(a)[Math.min(a.length-1,Math.floor(a.length*p))]:null;
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const idxLE=(a,t)=>{let lo=0,hi=a.length-1,r=0;while(lo<=hi){const m=(lo+hi)>>1;if(a[m]<=t+1e-6){r=m;lo=m+1}else hi=m-1}return r};
const idxNear=(a,t)=>{const i=idxLE(a,t);return i+1<a.length&&Math.abs(a[i+1]-t)<Math.abs(a[i]-t)?i+1:i};
const tally=a=>a.reduce((o,x)=>(o[x]=(o[x]||0)+1,o),{});
// 途中経過の保存（クラッシュ後も残す）。診断情報のみ。localStorageへ同期書き込み（ベストエフォート）
const SK='vpb:report',BK='vpb:beat';
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(REPORT))}catch(e){}};
const beat=(ph,f,i)=>{try{localStorage.setItem(BK,JSON.stringify({ph,f,i,t:new Date().toISOString()}))}catch(e){}};
function cls(P,mt,ei){if(mt==null)return{c:'no-result'};const i=idxNear(P.ps,mt),off=Math.abs(P.ps[i]-mt),d=i-ei;
 const c=off>0.002?'off-grid':d===0?'exact':d===1?'next-frame':d===-1?'prev-frame':(d<-1&&P.keys.has(P.ps[i]))?'keyframe-snap':'wrong-frame';return{c,d,off:r3(off)}}
async function loadMB(){const errs=[];for(const s of MB_SRC){try{const m=await import(s);if(!m.Input)throw new Error('Input なし');MB=m;return s}catch(e){errs.push(s+' → '+errS(e))}}throw new Error(errs.join(' | '))}
// WebGLコンテキストは作らない（GPU名の取得をやめた。GPU情報は chrome://gpu で確認）
async function env(){const e={userAgent:navigator.userAgent,isSecureContext,protocol:location.protocol,cores:navigator.hardwareConcurrency,deviceMemoryGB:navigator.deviceMemory??null,gpu:'未取得（WebGLを作らない）',
 api:{VideoDecoder:typeof VideoDecoder,rVFC:'requestVideoFrameCallback' in HTMLVideoElement.prototype,perfMemory:!!performance.memory,mediaCapabilities:!!navigator.mediaCapabilities}};
 try{const u=navigator.userAgentData;if(u){e.uaBrands=u.brands.map(b=>b.brand+' '+b.version);const h=await u.getHighEntropyValues(['platform','platformVersion','architecture','bitness']);delete h.brands;e.uaHigh=h}}catch(x){}return e}
async function parse(file){const {Input,BlobSource,ALL_FORMATS,EncodedPacketSink}=MB;const input=new Input({source:new BlobSource(file),formats:ALL_FORMATS});
 try{const track=await input.getPrimaryVideoTrack();if(!track)throw new Error('映像トラックなし');const sink=new EncodedPacketSink(track);
 const pts=[],keys=new Set();let p=await sink.getFirstPacket({metadataOnly:true});
 while(p&&pts.length<40000){pts.push(p.timestamp);if(p.type==='key')keys.add(p.timestamp);p=await sink.getNextPacket(p,{metadataOnly:true})}
 const ps=sorted(pts),d=[];for(let i=1;i<ps.length;i++)d.push(ps[i]-ps[i-1]);const fd=med(d)||1/30;
 const kv=[...keys].sort((x,y)=>x-y).map(t=>idxLE(ps,t));let gap=0;for(let i=1;i<kv.length;i++)gap=Math.max(gap,kv[i]-kv[i-1]);
 let rot=null;try{rot=await track.getRotation()}catch(e){}const cfg=await track.getDecoderConfig();
 let au=false;try{const a=await input.getPrimaryAudioTrack();if(a){const ac=await a.getDecoderConfig();au={codec:ac&&ac.codec,channels:ac&&ac.numberOfChannels,sampleRate:ac&&ac.sampleRate,note:'存在確認のみ（再生・同期はStep D）'}}}catch(e){au=null}
 const info={codec:cfg&&cfg.codec,codedWidth:cfg&&cfg.codedWidth,codedHeight:cfg&&cfg.codedHeight,rotation:rot,frames:ps.length,truncated:pts.length>=40000,keyframes:keys.size,maxKeyGapFrames:gap,
  medianFrameSec:r3(fd),fpsMedian:r3(1/fd),fpsAverage:r3((ps.length-1)/(ps[ps.length-1]-ps[0]||1)),vfrDeviatingRatio:r3(d.filter(x=>Math.abs(x-fd)>fd*.25).length/(d.length||1)),
  embeddedAudio:au,hasReorder:pts.some((x,i)=>i&&x<pts[i-1]),firstPts:r3(ps[0]),lastPts:r3(ps[ps.length-1])};
 return{input,track,sink,ps,keys,fd,cfg,info}}catch(e){try{input.dispose()}catch(x){}throw e}}
function targets(P,n){const R=rng(12345),a=P.ps,o=[];for(let i=0;i<n;i++){const k=Math.min(a.length-1,Math.floor(a.length*(i+R()*.8)/n));o.push(i%2?a[k]+P.fd*.5:a[k])}
 for(let i=o.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}
// <video>: 生成と、後片付け完了待ち（emptied＋猶予）。次のデコーダーはこの完了後にだけ作る
async function openVideo(file){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';const u=mk(file);v.src=u;$('pv').replaceChildren(v);const h={v,u};
 try{await new Promise((ok,ng)=>{const t=setTimeout(()=>ng(new Error('loadeddata タイムアウト')),15000);v.onloadeddata=()=>{clearTimeout(t);ok()};v.onerror=()=>{clearTimeout(t);ng(new Error('MEDIA_ERR_'+(v.error&&v.error.code)+' '+(v.error&&v.error.message||'')))}})}catch(e){await closeVideo(h);throw e}return h}
async function closeVideo(h){const v=h.v;let em=null;try{em=new Promise(r=>v.addEventListener('emptied',r,{once:true}));v.pause();v.removeAttribute('src');v.load()}catch(e){}
 try{v.remove()}catch(e){}rm(h.u);await Promise.race([em||Promise.resolve(),sleep(1000)]);await sleep(300)}
function seekOnce(v,t,tmo=4000){return new Promise(res=>{const s=now(),o={req:r3(t)};let done=false,id=0;
 const fin=x=>{if(done)return;done=true;clearTimeout(tm);v.removeEventListener('seeked',onS);try{v.cancelVideoFrameCallback(id)}catch(e){}Object.assign(o,x);res(o)},onS=()=>{o.seekedMs=r3(now()-s)},tm=setTimeout(()=>fin({timeout:true,mediaTime:null}),tmo);
 v.addEventListener('seeked',onS);
 id=v.requestVideoFrameCallback((n,md)=>fin({presentMs:r3(now()-s),mediaTime:md.mediaTime,presentedFrames:md.presentedFrames,processingMs:r3(md.processingDuration!=null?md.processingDuration*1000:null),expectedDisplayLeadMs:r3(md.expectedDisplayTime!=null?md.expectedDisplayTime-n:null),size:md.width+'x'+md.height}));
 v.currentTime=t})}
async function seekTest(P,v,n,fn){const T=targets(P,n);await seekOnce(v,P.ps[P.ps.length-1]);const R=[];
 for(const t of T){beat('seek',fn,R.length);const o=await seekOnce(v,t),ei=idxLE(P.ps,t);o.expectedIdx=ei;o.expectedPts=r3(P.ps[ei]);Object.assign(o,cls(P,o.mediaTime,ei));R.push(o)}
 const pm=R.filter(x=>x.presentMs!=null).map(x=>x.presentMs);
 return{summary:{n:R.length,classes:tally(R.map(x=>x.c)),timeouts:R.filter(x=>x.timeout).length,presentMsMedian:r3(med(pm)),presentMsP95:r3(pct(pm,.95)),presentMsMax:r3(Math.max(0,...pm)),
  rawDeltaSecMax:r3(Math.max(0,...R.filter(x=>x.mediaTime!=null).map(x=>Math.abs(x.mediaTime-x.req))))},results:R,targets:T}}
async function rapidTest(P,v,n=40,gap=20){const T=targets(P,n),cb=[];let alive=true,sk=0,lt0=now(),stall=0,rid=0;const iv=setInterval(()=>{const x=now();stall=Math.max(stall,x-lt0-10);lt0=x},10);
 const loop=(a,md)=>{cb.push({t:now(),mt:md.mediaTime});if(alive)rid=v.requestVideoFrameCallback(loop)};const onS=()=>sk++;v.addEventListener('seeked',onS);rid=v.requestVideoFrameCallback(loop);let last=0;
 try{for(const t of T){v.currentTime=t;last=now();await sleep(gap)}
 const lt=T[T.length-1],ei=idxLE(P.ps,lt);let q=0;while(q<60){const c0=cb.length;await sleep(100);if(cb.length===c0&&now()-last>400)break;q++}
 const after=cb.filter(x=>x.t>last),L=cb[cb.length-1],ok=after.find(x=>cls(P,x.mt,ei).c==='exact');
 return{issued:n,gapMs:gap,mainThreadMaxStallMs:r3(stall),seekedEvents:sk,callbacks:cb.length,finalClass:L?cls(P,L.mt,ei):null,callbacksAfterLastRequest:after.length,
  staleAfterLastRequest:after.filter(x=>cls(P,x.mt,ei).c!=='exact').length,msToExactFrame:ok?r3(ok.t-last):null}}
 finally{alive=false;clearInterval(iv);try{v.cancelVideoFrameCallback(rid)}catch(e){}v.removeEventListener('seeked',onS)}}
async function playTest(P,v,sec){const cb=[];let alive=true,rid=0;const loop=(n,md)=>{cb.push({mt:md.mediaTime,pf:md.presentedFrames,pd:md.processingDuration});if(alive)rid=v.requestVideoFrameCallback(loop)};
 try{await seekOnce(v,P.ps[0]);const q0=v.getVideoPlaybackQuality&&v.getVideoPlaybackQuality();rid=v.requestVideoFrameCallback(loop);const t0=now();
 try{await v.play()}catch(e){return{error:errS(e)}}await sleep(sec*1e3);v.pause();const wall=(now()-t0)/1e3,q=v.getVideoPlaybackQuality&&v.getVideoPlaybackQuality();
 const mt=cb.map(x=>x.mt),g=[];for(let i=1;i<mt.length;i++)g.push(mt[i]-mt[i-1]);const uniq=new Set(mt).size,exp=mt.length?idxLE(P.ps,mt[mt.length-1])-idxLE(P.ps,mt[0])+1:0;
 return{wallSec:r3(wall),mediaAdvanceSec:r3(mt.length?mt[mt.length-1]-mt[0]:0),callbacks:cb.length,uniqueFrames:uniq,expectedFramesByPts:exp,missedFramesByPts:exp-uniq,
  presentedFramesSpan:cb.length?cb[cb.length-1].pf-cb[0].pf+1:0,droppedVideoFrames:q?q.droppedVideoFrames-(q0?q0.droppedVideoFrames:0):null,maxGapSec:r3(Math.max(0,...g)),medianGapSec:r3(med(g)),
  processingMsMedian:r3(med(cb.filter(x=>x.pd!=null).map(x=>x.pd*1e3)))}}finally{alive=false;try{v.pause();v.cancelVideoFrameCallback(rid)}catch(e){}}}
const heap=()=>performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576*10)/10:null;
async function stressTest(P,v,n,fn){const T=targets(P,n),h0=heap(),ms=[];let to=0,i=0;for(const t of T){beat('stress',fn,i++);const o=await seekOnce(v,t,3000);if(o.timeout)to++;else ms.push(o.presentMs)}
 return{seeks:n,timeouts:to,presentMsMedian:r3(med(ms)),presentMsP95:r3(pct(ms,.95)),presentMsMax:r3(Math.max(0,...ms)),jsHeapMB:{before:h0,after:heap()}}}
async function recycle(f,k=8){const h0=heap();let fail=0;for(let i=0;i<k;i++){beat('recycle',f.name,i);try{await closeVideo(await openVideo(f))}catch(e){fail++}await sleep(300)}return{cycles:k,failures:fail,liveObjectUrls:urls,jsHeapMB:{before:h0,after:heap()}}}
// WebCodecs: デコーダーは例外時も finally で必ず close。VideoFrameは必ず close。luma=trueのときだけ読み戻し（drawImage+getImageData）
async function decodeRun(P,hwa,T,luma,fn){let frames=[],err=null,opened=0,closed=0,dead=false;const R=[];
 const dec=new VideoDecoder({output:f=>{opened++;if(dead){try{f.close()}catch(e){}closed++;return}frames.push(f)},error:e=>{err=errS(e)}});let cx=null;
 if(luma){const cv=document.createElement('canvas');cv.width=32;cv.height=18;cx=cv.getContext('2d',{willReadFrequently:true})}
 try{dec.configure({...P.cfg,hardwareAcceleration:hwa});
  for(const t of T){beat('webcodecs',fn,R.length);const s=now(),ei=idxLE(P.ps,t);frames=[];let fed=0,extra=0;
   try{let p=await P.sink.getKeyPacket(t);while(p&&!err){dec.decode(p.toEncodedVideoChunk());fed++;if(p.timestamp>t&&++extra>=4)break;if(dec.decodeQueueSize>30)await sleep(0);p=await P.sink.getNextPacket(p)}await dec.flush()}catch(e){err=err||errS(e)}
   const ms=now()-s;let best=null;for(const f of frames){const x=f.timestamp/1e6;if(x<=t+2e-6&&(!best||x>best.timestamp/1e6))best=f}
   let c=null,lr=null;if(best){c=cls(P,best.timestamp/1e6,ei);if(cx)try{cx.drawImage(best,0,0,32,18);const d=cx.getImageData(0,0,32,18).data;let mn=255,mx=0;for(let i=0;i<d.length;i+=4){const y=d[i]*.3+d[i+1]*.59+d[i+2]*.11;mn=Math.min(mn,y);mx=Math.max(mx,y)}lr=Math.round(mx-mn)}catch(e){}}
   for(const f of frames){try{f.close()}catch(e){}closed++}frames=[];R.push({req:r3(t),expectedIdx:ei,fed,ms:r3(ms),frame:c?c.c:'no-frame',diff:c?c.d:null,lumaRange:lr,error:err});if(err)break}
 }catch(e){err=err||errS(e)}
 finally{dead=true;for(const f of frames){try{f.close()}catch(e){}closed++}frames=[];try{if(dec.state!=='closed')dec.close()}catch(e){}}
 const ms=R.map(x=>x.ms);return{hwa,opened,closed,leakedFrames:opened-closed,classes:tally(R.map(x=>x.frame)),msMedian:r3(med(ms)),msP95:r3(pct(ms,.95)),error:err,results:R}}
async function wcTest(P,T,luma,fn){if(typeof VideoDecoder!=='function')return{error:'VideoDecoder なし'};const o={codec:P.cfg.codec,configSupport:{}};let first=null;
 for(const h of['no-preference','prefer-hardware','prefer-software']){try{const r=await VideoDecoder.isConfigSupported({...P.cfg,hardwareAcceleration:h});o.configSupport[h]=r.supported;if(r.supported&&!first)first=h}catch(e){o.configSupport[h]=errS(e)}}
 if(!first)return o;o.main=await decodeRun(P,first,T,luma,fn);
 if(/^(hev1|hvc1)/.test(P.cfg.codec)){o.byHwa=[];for(const h of['prefer-hardware','prefer-software'])if(o.configSupport[h]===true&&h!==first){await sleep(500);o.byHwa.push(await decodeRun(P,h,T.slice(0,4),luma,fn))}}
 return o}
// 対応確認のみ（デコードしない）。安全モードではWebCodecsの isConfigSupported も no-preference のみ
async function capTest(P,safe){const c=P.cfg.codec||'',o={codec:c,canPlayType:{},mediaCapabilities:[],webcodecsConfigSupport:{}},alts=[c];if(/^hev1/.test(c))alts.push(c.replace('hev1','hvc1'));if(/^hvc1/.test(c))alts.push(c.replace('hvc1','hev1'));
 for(const a of alts){const ty='video/mp4; codecs="'+a+'"';o.canPlayType[ty]=document.createElement('video').canPlayType(ty)||'(空)';
  try{const r=await navigator.mediaCapabilities.decodingInfo({type:'file',video:{contentType:ty,width:P.cfg.codedWidth||1920,height:P.cfg.codedHeight||1080,bitrate:8e6,framerate:Math.round(1/P.fd)||30}});o.mediaCapabilities.push({ty,supported:r.supported,smooth:r.smooth,powerEfficient:r.powerEfficient})}catch(e){o.mediaCapabilities.push({ty,error:errS(e)})}}
 if(typeof VideoDecoder==='function')for(const h of safe?['no-preference']:['no-preference','prefer-hardware','prefer-software']){try{o.webcodecsConfigSupport[h]=(await VideoDecoder.isConfigSupported({...P.cfg,hardwareAcceleration:h})).supported}catch(e){o.webcodecsConfigSupport[h]=errS(e)}}
 return o}
// ---- フェーズ実行（1回に1フェーズ・1ファイル） ----
const isHevc=P=>/^(hev1|hvc1)/.test(P.info.codec||'');
function blockReason(ph,safe,P){if(!safe)return null;if(['rapid','recycle','webcodecs'].includes(ph))return '安全モードでは省略: '+({rapid:'高頻度の連続シーク',recycle:'動画要素の大量再生成',webcodecs:'WebCodecsの実デコード'})[ph];
 if(isHevc(P)&&['seek','play','stress'].includes(ph))return '安全モードでは省略: HEVCのハードウェアデコード試験';return null}
const withVideo=async(f,fn)=>{const h=await openVideo(f);try{return await fn(h.v)}finally{await closeVideo(h)}};
async function doPhase(ph,f,P,safe,it){const n=(k,cap)=>safe?Math.min(+$(k).value,cap):+$(k).value,luma=$('cLuma').checked&&!safe;
 if(ph==='info'){it.capability=await capTest(P,safe);return it.capability}
 if(ph==='seek')return it.seek=await withVideo(f,v=>seekTest(P,v,n('nSeek',8),f.name));
 if(ph==='rapid')return it.rapid=await withVideo(f,v=>rapidTest(P,v));
 if(ph==='play')return it.play=await withVideo(f,v=>playTest(P,v,n('nPlay',5)));
 if(ph==='stress')return it.stress=await withVideo(f,v=>stressTest(P,v,n('nStress',30),f.name));
 if(ph==='recycle')return it.recycle=await recycle(f);
 if(ph==='webcodecs'){await sleep(500);return it.webcodecs=await wcTest(P,targets(P,n('nSeek',8)),luma,f.name)}}
const item=f=>{let it=REPORT.items.find(x=>x.file.name===f.name);if(!it){it={file:{name:f.name,sizeBytes:f.size},errors:[]};REPORT.items.push(it)}return it};
function setBusy(b){busy=b;document.querySelectorAll('.ph,#fi,#fsel').forEach(x=>x.disabled=b)}
async function runPhase(ph){if(busy)return;const f=FILES[+$('fsel').value];if(!f)return alert('動画ファイルを選んでください');const safe=$('cSafe').checked;setBusy(true);
 const rec={phase:ph,file:f.name,safeMode:safe,startedAt:new Date().toISOString(),endedAt:null,status:'running'};REPORT.phases.push(rec);const it=item(f);save();beat(ph,f.name,0);log('▶ '+ph+'  '+f.name+(safe?'  [安全モード]':''));let P=null;
 try{if(/^(image|audio)\//.test(f.type)){rec.status='skipped';rec.reason='Step B対象外（画像・独立音声）';log('  スキップ: '+rec.reason)}
  else{P=await parse(f);it.parser=P.info;const why=blockReason(ph,safe,P);
   if(why){rec.status='skipped';rec.reason=why;log('  '+why)}else{const r=await doPhase(ph,f,P,safe,it);rec.status='done';log('  '+JSON.stringify(r&&(r.summary||r.main&&{cfg:r.configSupport,classes:r.main.classes,msMedian:r.main.msMedian,leak:r.main.leakedFrames,err:r.main.error}||r)).slice(0,900))}}}
 catch(e){rec.status='error';rec.error=errS(e);it.errors.push(ph+': '+errS(e));log('  失敗: '+errS(e))}
 finally{try{P&&P.input.dispose()}catch(e){}rec.endedAt=new Date().toISOString();rec.liveObjectUrls=urls;save();try{localStorage.removeItem(BK)}catch(e){}setBusy(false);log('■ '+ph+' → '+rec.status+'\n')}}
function newReport(env){return{schema:TOOL.schema,tool:{name:TOOL.name,version:TOOL.version},createdAt:new Date().toISOString(),environment:env,library:{name:'mediabunny',version:MB_VER},privacy:'診断情報のみ。動画本体・映像データは含まない',phases:[],items:[]}}
function exportJson(){const d=new Date(),z=n=>String(n).padStart(2,'0'),nm='video_probe_b_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+'.json';
 REPORT.exportedAt=d.toISOString();const u=mk(new Blob([JSON.stringify(REPORT,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>rm(u),10000)}
async function init(){PHASES.forEach(([k,l])=>{const b=document.createElement('button');b.className='ph';b.textContent=l;b.onclick=()=>runPhase(k);$('btns').appendChild(b)});
 $('fi').onchange=()=>{FILES=[...$('fi').files];$('fsel').replaceChildren(...FILES.map((f,i)=>new Option(f.name,i)))};
 $('cSafe').onchange=e=>{if(!e.target.checked&&!confirm('安全モードを解除すると、HEVCのハードウェアデコードやWebCodecs、高頻度シークを実行できます。GPUドライバーが不安定な環境ではクラッシュの恐れがあります。解除しますか？'))e.target.checked=true;$('cLuma').disabled=e.target.checked;if(e.target.checked)$('cLuma').checked=false};$('cLuma').disabled=true;
 $('save').onclick=exportJson;$('reset').onclick=()=>{if(confirm('保存済みの診断結果を消去しますか？')){try{localStorage.removeItem(SK);localStorage.removeItem(BK)}catch(e){}REPORT=newReport(REPORT.environment);$('warn').textContent='';log('消去しました')}};
 const env0=await env();try{REPORT=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
 if(REPORT&&REPORT.schema===TOOL.schema){const r=REPORT.phases.filter(p=>p.status==='running').pop();let b=null;try{b=JSON.parse(localStorage.getItem(BK)||'null')}catch(e){}
  if(r){r.status='interrupted';r.interruptedNote='ページ再読み込み時に「実行中」のまま残っていた（クラッシュ・強制終了の可能性）';if(b)r.lastBeat=b;save();$('warn').textContent='前回、フェーズ「'+r.phase+'」（'+r.file+'）の実行中に中断した可能性があります'+(b?'（最後の進捗: '+b.i+'件目）':'')+'。結果は保存済みで、JSON保存できます。'}}
 else REPORT=newReport(env0);REPORT.environment=env0;
 try{const s=await loadMB();$('stat').innerHTML='<small>HTTPS:'+(location.protocol==='https:')+' / VideoDecoder:'+env0.api.VideoDecoder+' / rVFC:'+env0.api.rVFC+' / Mediabunny '+MB_VER+'（'+s+'）／保存済みフェーズ:'+REPORT.phases.length+'</small>'}catch(e){$('stat').textContent='ライブラリ読込失敗: '+errS(e);document.querySelectorAll('.ph').forEach(x=>x.disabled=true)}}
init();window.__b={runPhase,report:()=>REPORT,liveUrls:()=>urls};
</script></body></html>
