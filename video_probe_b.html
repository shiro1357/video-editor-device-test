<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Probe B</title>
<style>:root{color-scheme:light dark;--bg:#fff;--fg:#1a1a1a;--bd:#8886}@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee}}
body{margin:0;padding:10px;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif}
button,input{font:inherit;padding:8px 10px;margin:3px 3px 3px 0}input[type=number]{width:4.5em}
pre{white-space:pre-wrap;word-break:break-all;border:1px solid var(--bd);padding:8px;border-radius:6px;max-height:55vh;overflow:auto;font-size:12px}
video{max-width:160px;max-height:90px}small{opacity:.7}label{margin-right:10px;white-space:nowrap}h1{font-size:18px}</style></head><body>
<h1>Video Probe <small>Step B / v0.1.1</small></h1>
<p><small>映像エンジン検証（HTMLVideoElement と WebCodecs VideoDecoder の比較）。選んだファイルはブラウザ内だけで処理し、送信しません。</small></p>
<input type="file" id="fi" accept="video/*,.mov,.mp4,.m4v,.webm" multiple><br>
<label><input type="checkbox" id="cSeek" checked>シーク精度・連続シーク</label>
<label><input type="checkbox" id="cPlay" checked>再生・負荷</label>
<label><input type="checkbox" id="cWc" checked>WebCodecs</label><br>
<label>シーク回数<input type="number" id="nSeek" value="16" min="4" max="60"></label>
<label>再生秒<input type="number" id="nPlay" value="5" min="2" max="60"></label>
<label>負荷シーク<input type="number" id="nStress" value="100" min="20" max="500"></label><br>
<button id="run">検査開始</button><button id="save" disabled>JSON保存</button>
<div id="pv"></div><div id="stat"><small>環境確認中…</small></div><pre id="log"></pre>
<script>
'use strict';
const TOOL={name:'video_probe_b',version:'0.1.1',schema:'video-probe-b/1'};
const MB_VER='1.64.0',MB_SRC=['./vendor/mediabunny.min.mjs','https://cdn.jsdelivr.net/npm/mediabunny@'+MB_VER+'/dist/bundles/mediabunny.min.mjs'];
const $=id=>document.getElementById(id),now=()=>performance.now(),r3=x=>x==null?null:Math.round(x*1000)/1000,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const log=s=>{const e=$('log');e.textContent+=s+'\n';e.scrollTop=1e9},errS=e=>e&&e.name?e.name+': '+e.message:String(e);
let MB=null,urls=0,REPORT=null;const mk=b=>{urls++;return URL.createObjectURL(b)},rm=u=>{urls--;URL.revokeObjectURL(u)};
const sorted=a=>[...a].sort((x,y)=>x-y),med=a=>a.length?sorted(a)[a.length>>1]:null,pct=(a,p)=>a.length?sorted(a)[Math.min(a.length-1,Math.floor(a.length*p))]:null;
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const idxLE=(a,t)=>{let lo=0,hi=a.length-1,r=0;while(lo<=hi){const m=(lo+hi)>>1;if(a[m]<=t+1e-6){r=m;lo=m+1}else hi=m-1}return r};
const idxNear=(a,t)=>{const i=idxLE(a,t);return i+1<a.length&&Math.abs(a[i+1]-t)<Math.abs(a[i]-t)?i+1:i};
// 提示フレームの分類: PTS表から「期待フレーム」を求め、実提示との差をフレーム数で評価する
function cls(P,mt,ei){if(mt==null)return{c:'no-result'};const i=idxNear(P.ps,mt),off=Math.abs(P.ps[i]-mt),d=i-ei;
 const c=off>0.002?'off-grid':d===0?'exact':d===1?'next-frame':d===-1?'prev-frame':(d<-1&&P.keys.has(P.ps[i]))?'keyframe-snap':'wrong-frame';return{c,d,off:r3(off)}}
const tally=a=>a.reduce((o,x)=>(o[x]=(o[x]||0)+1,o),{});
async function loadMB(){const errs=[];for(const s of MB_SRC){try{const m=await import(s);if(!m.Input)throw new Error('Input なし');MB=m;return s}catch(e){errs.push(s+' → '+errS(e))}}throw new Error(errs.join(' | '))}
async function env(){const e={userAgent:navigator.userAgent,isSecureContext,protocol:location.protocol,cores:navigator.hardwareConcurrency,deviceMemoryGB:navigator.deviceMemory??null,
 api:{VideoDecoder:typeof VideoDecoder,rVFC:'requestVideoFrameCallback' in HTMLVideoElement.prototype,perfMemory:!!performance.memory,mediaCapabilities:!!navigator.mediaCapabilities}};
 try{const u=navigator.userAgentData;if(u){e.uaBrands=u.brands.map(b=>b.brand+' '+b.version);const h=await u.getHighEntropyValues(['platform','platformVersion','architecture','bitness']);delete h.brands;e.uaHigh=h}}catch(x){}
 try{const g=document.createElement('canvas').getContext('webgl'),x=g&&g.getExtension('WEBGL_debug_renderer_info');e.gpu=x?g.getParameter(x.UNMASKED_RENDERER_WEBGL):(g?'(masked)':null)}catch(x){}return e}
// 元動画のPTS表（全packetのメタデータのみ。映像データは読まない）
async function parse(file){const {Input,BlobSource,ALL_FORMATS,EncodedPacketSink}=MB;const input=new Input({source:new BlobSource(file),formats:ALL_FORMATS});
 const track=await input.getPrimaryVideoTrack();if(!track)throw new Error('映像トラックなし');const sink=new EncodedPacketSink(track);
 const pts=[],keys=new Set();let p=await sink.getFirstPacket({metadataOnly:true});
 while(p&&pts.length<40000){pts.push(p.timestamp);if(p.type==='key')keys.add(p.timestamp);p=await sink.getNextPacket(p,{metadataOnly:true})}
 const ps=sorted(pts),d=[];for(let i=1;i<ps.length;i++)d.push(ps[i]-ps[i-1]);const fd=med(d)||1/30;
 const kv=[...keys].sort((x,y)=>x-y).map(t=>idxLE(ps,t));let gap=0;for(let i=1;i<kv.length;i++)gap=Math.max(gap,kv[i]-kv[i-1]);
 let rot=null;try{rot=await track.getRotation()}catch(e){}
 const cfg=await track.getDecoderConfig();
 let au=false;try{const a=await input.getPrimaryAudioTrack();if(a){const ac=await a.getDecoderConfig();au={codec:ac&&ac.codec,channels:ac&&ac.numberOfChannels,sampleRate:ac&&ac.sampleRate,note:'存在確認のみ（再生・同期検証はStep D）'}}}catch(e){au=null}
 const info={codec:cfg&&cfg.codec,codedWidth:cfg&&cfg.codedWidth,codedHeight:cfg&&cfg.codedHeight,rotation:rot,frames:ps.length,truncated:pts.length>=40000,keyframes:keys.size,maxKeyGapFrames:gap,
  medianFrameSec:r3(fd),fpsMedian:r3(1/fd),fpsAverage:r3((ps.length-1)/(ps[ps.length-1]-ps[0]||1)),vfrDeviatingRatio:r3(d.filter(x=>Math.abs(x-fd)>fd*.25).length/(d.length||1)),
  embeddedAudio:au,hasReorder:pts.some((x,i)=>i&&x<pts[i-1]),firstPts:r3(ps[0]),lastPts:r3(ps[ps.length-1])};
 return{input,track,sink,ps,keys,fd,cfg,info}}
function targets(P,n){const R=rng(12345),a=P.ps,o=[];for(let i=0;i<n;i++){const k=Math.min(a.length-1,Math.floor(a.length*(i+R()*.8)/n));o.push(i%2?a[k]+P.fd*.5:a[k])}
 for(let i=o.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}
async function openVideo(file){const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';const u=mk(file);v.src=u;$('pv').replaceChildren(v);
 try{await new Promise((ok,ng)=>{const t=setTimeout(()=>ng(new Error('loadeddata タイムアウト')),15000);v.onloadeddata=()=>{clearTimeout(t);ok()};v.onerror=()=>{clearTimeout(t);ng(new Error('MEDIA_ERR_'+(v.error&&v.error.code)+' '+(v.error&&v.error.message||'')))}})}catch(e){closeVideo({v,u});throw e}
 return{v,u}}
function closeVideo(h){try{h.v.pause();h.v.removeAttribute('src');h.v.load()}catch(e){}rm(h.u);$('pv').replaceChildren()}
function seekOnce(v,t,tmo=4000){return new Promise(res=>{const s=now(),o={req:r3(t)};let done=false;
 const fin=x=>{if(done)return;done=true;clearTimeout(tm);v.removeEventListener('seeked',onS);Object.assign(o,x);res(o)},onS=()=>{o.seekedMs=r3(now()-s)},tm=setTimeout(()=>fin({timeout:true,mediaTime:null}),tmo);
 v.addEventListener('seeked',onS);
 v.requestVideoFrameCallback((n,md)=>fin({presentMs:r3(now()-s),mediaTime:md.mediaTime,presentedFrames:md.presentedFrames,processingMs:r3(md.processingDuration!=null?md.processingDuration*1000:null),expectedDisplayLeadMs:r3(md.expectedDisplayTime!=null?md.expectedDisplayTime-n:null),size:md.width+'x'+md.height}));
 v.currentTime=t})}
async function seekTest(P,v,n){const T=targets(P,n);await seekOnce(v,P.ps[P.ps.length-1]);const R=[];
 for(const t of T){const o=await seekOnce(v,t),ei=idxLE(P.ps,t);o.expectedIdx=ei;o.expectedPts=r3(P.ps[ei]);Object.assign(o,cls(P,o.mediaTime,ei));R.push(o)}
 const pm=R.filter(x=>x.presentMs!=null).map(x=>x.presentMs);
 return{summary:{n:R.length,classes:tally(R.map(x=>x.c)),timeouts:R.filter(x=>x.timeout).length,presentMsMedian:r3(med(pm)),presentMsP95:r3(pct(pm,.95)),presentMsMax:r3(Math.max(0,...pm)),
  rawDeltaSecMax:r3(Math.max(0,...R.filter(x=>x.mediaTime!=null).map(x=>Math.abs(x.mediaTime-x.req))))},results:R,targets:T}}
// 連続シーク: 短い間隔で要求を出し続け、最後の要求以外の結果が表示に残るかを見る
async function rapidTest(P,v,n=40,gap=20){const T=targets(P,n),cb=[];let alive=true,sk=0,lt0=now(),stall=0;const iv=setInterval(()=>{const n=now();stall=Math.max(stall,n-lt0-10);lt0=n},10);const loop=(a,md)=>{cb.push({t:now(),mt:md.mediaTime});if(alive)v.requestVideoFrameCallback(loop)};
 const onS=()=>sk++;v.addEventListener('seeked',onS);v.requestVideoFrameCallback(loop);let last=0;
 for(const t of T){v.currentTime=t;last=now();await sleep(gap)}
 const lt=T[T.length-1],ei=idxLE(P.ps,lt);let q=0;while(q<60){const c0=cb.length;await sleep(100);if(cb.length===c0&&now()-last>400)break;q++}
 alive=false;clearInterval(iv);v.removeEventListener('seeked',onS);const after=cb.filter(x=>x.t>last),L=cb[cb.length-1];const ok=after.find(x=>cls(P,x.mt,ei).c==='exact');
 return{issued:n,gapMs:gap,mainThreadMaxStallMs:r3(stall),seekedEvents:sk,callbacks:cb.length,finalClass:L?cls(P,L.mt,ei):null,callbacksAfterLastRequest:after.length,
  staleAfterLastRequest:after.filter(x=>cls(P,x.mt,ei).c!=='exact').length,msToExactFrame:ok?r3(ok.t-last):null}}
async function playTest(P,v,sec){const cb=[];let alive=true;const loop=(n,md)=>{cb.push({mt:md.mediaTime,pf:md.presentedFrames,pd:md.processingDuration});if(alive)v.requestVideoFrameCallback(loop)};
 await seekOnce(v,P.ps[0]);const q0=v.getVideoPlaybackQuality&&v.getVideoPlaybackQuality();v.requestVideoFrameCallback(loop);const t0=now();
 try{await v.play()}catch(e){alive=false;return{error:errS(e)}}await sleep(sec*1e3);v.pause();alive=false;const wall=(now()-t0)/1e3,q=v.getVideoPlaybackQuality&&v.getVideoPlaybackQuality();
 const mt=cb.map(x=>x.mt),g=[];for(let i=1;i<mt.length;i++)g.push(mt[i]-mt[i-1]);const uniq=new Set(mt).size,exp=mt.length?idxLE(P.ps,mt[mt.length-1])-idxLE(P.ps,mt[0])+1:0;
 return{wallSec:r3(wall),mediaAdvanceSec:r3(mt.length?mt[mt.length-1]-mt[0]:0),callbacks:cb.length,uniqueFrames:uniq,expectedFramesByPts:exp,missedFramesByPts:exp-uniq,
  presentedFramesSpan:cb.length?cb[cb.length-1].pf-cb[0].pf+1:0,droppedVideoFrames:q?q.droppedVideoFrames-(q0?q0.droppedVideoFrames:0):null,maxGapSec:r3(Math.max(0,...g)),medianGapSec:r3(med(g)),
  processingMsMedian:r3(med(cb.filter(x=>x.pd!=null).map(x=>x.pd*1e3)))}}
const heap=()=>performance.memory?Math.round(performance.memory.usedJSHeapSize/1048576*10)/10:null;
async function stressTest(P,v,n){const T=targets(P,n),h0=heap(),ms=[];let to=0;for(const t of T){const o=await seekOnce(v,t,3000);if(o.timeout)to++;else ms.push(o.presentMs)}
 return{seeks:n,timeouts:to,presentMsMedian:r3(med(ms)),presentMsP95:r3(pct(ms,.95)),presentMsMax:r3(Math.max(0,...ms)),jsHeapMB:{before:h0,after:heap()}}}
async function recycle(file,k=8){const h0=heap();let fail=0;for(let i=0;i<k;i++){try{closeVideo(await openVideo(file))}catch(e){fail++}}return{cycles:k,failures:fail,liveObjectUrls:urls,jsHeapMB:{before:h0,after:heap()}}}
// WebCodecs: 近傍キーフレームから目標PTSまで限定デコード。デコーダーは1つを使い回し、VideoFrameは必ずclose
async function decodeRun(P,hwa,T){let frames=[],err=null,opened=0,closed=0;const dec=new VideoDecoder({output:f=>{opened++;frames.push(f)},error:e=>{err=errS(e)}});
 try{dec.configure({...P.cfg,hardwareAcceleration:hwa})}catch(e){return{hwa,error:errS(e)}}
 const cv=document.createElement('canvas');cv.width=32;cv.height=18;const cx=cv.getContext('2d',{willReadFrequently:true}),R=[];
 for(const t of T){const s=now(),ei=idxLE(P.ps,t);frames=[];let fed=0,extra=0;
  try{let p=await P.sink.getKeyPacket(t);while(p&&!err){dec.decode(p.toEncodedVideoChunk());fed++;if(p.timestamp>t&&++extra>=4)break;if(dec.decodeQueueSize>30)await sleep(0);p=await P.sink.getNextPacket(p)}await dec.flush()}catch(e){err=err||errS(e)}
  const ms=now()-s;let best=null;for(const f of frames){const x=f.timestamp/1e6;if(x<=t+2e-6&&(!best||x>best.timestamp/1e6))best=f}
  let c=null,luma=null;if(best){c=cls(P,best.timestamp/1e6,ei);try{cx.drawImage(best,0,0,32,18);const d=cx.getImageData(0,0,32,18).data;let mn=255,mx=0;for(let i=0;i<d.length;i+=4){const y=d[i]*.3+d[i+1]*.59+d[i+2]*.11;mn=Math.min(mn,y);mx=Math.max(mx,y)}luma=Math.round(mx-mn)}catch(e){}}
  for(const f of frames){f.close();closed++}frames=[];R.push({req:r3(t),expectedIdx:ei,fed,ms:r3(ms),frame:c?c.c:'no-frame',diff:c?c.d:null,lumaRange:luma,error:err});if(err)break}
 try{dec.close()}catch(e){}const ms=R.map(x=>x.ms);
 return{hwa,opened,closed,leakedFrames:opened-closed,classes:tally(R.map(x=>x.frame)),msMedian:r3(med(ms)),msP95:r3(pct(ms,.95)),error:err,results:R}}
async function wcTest(P,T){if(typeof VideoDecoder!=='function')return{error:'VideoDecoder なし'};const o={codec:P.cfg.codec,configSupport:{}};let first=null;
 for(const h of['no-preference','prefer-hardware','prefer-software']){try{const r=await VideoDecoder.isConfigSupported({...P.cfg,hardwareAcceleration:h});o.configSupport[h]=r.supported;if(r.supported&&!first)first=h}catch(e){o.configSupport[h]=errS(e)}}
 if(!first)return o;o.main=await decodeRun(P,first,T);
 if(/^(hev1|hvc1)/.test(P.cfg.codec)){o.byHwa=[];for(const h of['prefer-hardware','prefer-software'])if(o.configSupport[h]===true&&h!==first)o.byHwa.push(await decodeRun(P,h,T.slice(0,4)))}
 return o}
async function capTest(P,v){const c=P.cfg.codec||'',o={codec:c,canPlayType:{},mediaCapabilities:[]},alts=[c];if(/^hev1/.test(c))alts.push(c.replace('hev1','hvc1'));if(/^hvc1/.test(c))alts.push(c.replace('hvc1','hev1'));
 for(const a of alts){const ty='video/mp4; codecs="'+a+'"';o.canPlayType[ty]=document.createElement('video').canPlayType(ty)||'(空)';
  try{const r=await navigator.mediaCapabilities.decodingInfo({type:'file',video:{contentType:ty,width:P.cfg.codedWidth||1920,height:P.cfg.codedHeight||1080,bitrate:8e6,framerate:Math.round(1/P.fd)||30}});o.mediaCapabilities.push({ty,supported:r.supported,smooth:r.smooth,powerEfficient:r.powerEfficient})}catch(e){o.mediaCapabilities.push({ty,error:errS(e)})}}
 return o}
const sum=it=>{const s=[],h=it.html5,w=it.webcodecs&&it.webcodecs.main;if(h&&h.seek)s.push('seek '+JSON.stringify(h.seek.summary.classes)+' 提示'+h.seek.summary.presentMsMedian+'ms');if(h&&h.rapid)s.push('連続 最終'+(h.rapid.finalClass&&h.rapid.finalClass.c)+' 古い結果'+h.rapid.staleAfterLastRequest);
 if(h&&h.play)s.push('再生 欠落'+h.play.missedFramesByPts+' drop'+h.play.droppedVideoFrames);if(w)s.push('WC '+JSON.stringify(w.classes)+' '+w.msMedian+'ms leak'+w.leakedFrames);return s.join(' | ')};
async function runAll(files){const O={nSeek:+$('nSeek').value,nPlay:+$('nPlay').value,nStress:+$('nStress').value,seek:$('cSeek').checked,play:$('cPlay').checked,wc:$('cWc').checked};
 REPORT={schema:TOOL.schema,tool:{name:TOOL.name,version:TOOL.version},generatedAt:new Date().toISOString(),environment:await env(),library:{name:'mediabunny',version:MB_VER},options:O,
  privacy:'ファイル本体・ホスト名は含まない',items:[]};
 for(const f of files){log('▶ '+f.name+' ('+f.size+'B)');const it={file:{name:f.name,sizeBytes:f.size},errors:[]};REPORT.items.push(it);let P=null;if(/^(image|audio)\//.test(f.type)){it.skipped='Step B対象外（画像・独立音声）';log('  スキップ: '+it.skipped+'\n');continue}
  try{P=await parse(f);it.parser=P.info;log('  '+P.info.codec+' '+P.info.codedWidth+'x'+P.info.codedHeight+' rot'+P.info.rotation+' '+P.info.frames+'f fps中央値'+P.info.fpsMedian+' VFR逸脱'+P.info.vfrDeviatingRatio+' reorder'+P.info.hasReorder);
   const T=targets(P,O.nSeek);
   if(O.seek||O.play){let h=null;try{h=await openVideo(f);it.html5={videoWidth:h.v.videoWidth,videoHeight:h.v.videoHeight,duration:r3(h.v.duration)};it.capability=await capTest(P,h.v);
     if(O.seek){it.html5.seek=await seekTest(P,h.v,O.nSeek);log('  seek '+JSON.stringify(it.html5.seek.summary));it.html5.rapid=await rapidTest(P,h.v);log('  rapid '+JSON.stringify(it.html5.rapid))}
     if(O.play){it.html5.play=await playTest(P,h.v,O.nPlay);log('  play '+JSON.stringify(it.html5.play));it.html5.stress=await stressTest(P,h.v,O.nStress);log('  stress '+JSON.stringify(it.html5.stress))}
    }catch(e){it.errors.push('html5: '+errS(e));log('  html5失敗: '+errS(e));if(!it.capability)try{it.capability=await capTest(P,null)}catch(x){}}finally{if(h)closeVideo(h)}
    if(O.play){try{it.recycle=await recycle(f);log('  recycle '+JSON.stringify(it.recycle))}catch(e){it.errors.push('recycle: '+errS(e))}}}
   if(O.wc){try{it.webcodecs=await wcTest(P,T);log('  webcodecs '+JSON.stringify(it.webcodecs.main?{cfg:it.webcodecs.configSupport,classes:it.webcodecs.main.classes,msMedian:it.webcodecs.main.msMedian,leak:it.webcodecs.main.leakedFrames,err:it.webcodecs.main.error}:it.webcodecs))}catch(e){it.errors.push('webcodecs: '+errS(e))}}
  }catch(e){it.errors.push('parse: '+errS(e));log('  解析失敗: '+errS(e))}
  finally{try{P&&P.input.dispose()}catch(e){}}
  it.liveObjectUrls=urls;log('  → '+sum(it)+'\n')}
 $('save').disabled=false;log('完了（使用中ObjectURL='+urls+'）');return REPORT}
$('run').onclick=async()=>{const fs=[...$('fi').files];if(!fs.length)return alert('動画ファイルを選んでください');$('run').disabled=true;$('log').textContent='';try{await runAll(fs)}catch(e){log('異常終了: '+errS(e))}$('run').disabled=false};
$('save').onclick=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0'),nm='video_probe_b_'+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'_'+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())+'.json';
 const u=mk(new Blob([JSON.stringify(REPORT,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>rm(u),10000)};
(async()=>{try{const s=await loadMB();const e=await env();$('stat').innerHTML='<small>HTTPS:'+(e.protocol==='https:')+' / isSecureContext:'+e.isSecureContext+' / VideoDecoder:'+e.api.VideoDecoder+' / rVFC:'+e.api.rVFC+' / Mediabunny '+MB_VER+'（'+s+'）</small>'}catch(e){$('stat').textContent='ライブラリ読込失敗: '+errS(e);$('run').disabled=true}})();
window.__b={run:runAll,report:()=>REPORT,liveUrls:()=>urls};
</script></body></html>
